apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Turns the traceId field in a log line into a link into Tempo. This is
      # the whole point of putting the id in the log: logs answer "what
      # happened", traces answer "where did the time go", and one click moves
      # between them.
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"([a-f0-9]+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        # The reverse link: from a slow span to the log lines written during it.
        filterByTraceID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
