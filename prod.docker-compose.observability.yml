# The observability plane, production variant.
#
#   docker compose -f prod.docker-compose.yml -f prod.docker-compose.observability.yml up -d
#
# Differences from the local file, all of them deliberate:
#
#   * Prometheus joins the application's own network instead of scraping the
#     host, because in production the services publish no host ports at all.
#   * Scrapes authenticate with METRICS_AUTH_TOKEN. The gateway is public behind
#     Nginx, so an unauthenticated /metrics there would hand anyone the internal
#     route names, traffic volumes and error rates.
#   * Grafana keeps its login form. Anonymous admin is fine on a laptop and is
#     not fine on a droplet.
#   * Retention is 30d rather than 15d: on a live system the interesting
#     question is usually "what changed since last month", and the extra disk is
#     a few hundred megabytes.
#
# Both ports stay bound to 127.0.0.1. Neither Prometheus nor Grafana is the
# public surface — apps/control-center is, and it queries Prometheus
# server-side from inside this network.

services:
  prometheus:
    container_name: fishstudio-prometheus
    image: prom/prometheus:v3.1.0
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      # Without this the Control Center cannot be reached at a subpath and, more
      # importantly, Prometheus refuses admin APIs by default — leave it so.
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/observability/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/rules:/etc/prometheus/rules:ro
      # Written out by the deploy step from the METRICS_AUTH_TOKEN secret.
      # A file rather than an inline value so the token never appears in
      # `docker inspect` or in the compose file itself.
      - ./docker/observability/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus-data:/prometheus
    networks:
      - fish-studio-net

  grafana:
    container_name: fishstudio-grafana
    image: grafana/grafana:11.5.1
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - fish-studio-net

  loki:
    container_name: fishstudio-loki
    image: grafana/loki:3.3.2
    restart: always
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./docker/observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - fish-studio-net

  tempo:
    container_name: fishstudio-tempo
    image: grafana/tempo:2.7.1
    restart: always
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - fish-studio-net

  alertmanager:
    container_name: fishstudio-alertmanager
    image: prom/alertmanager:v0.28.0
    restart: always
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    env_file: .env.prod
    volumes:
      - ./docker/observability/alertmanager.prod.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - fish-studio-net

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alertmanager-data:

networks:
  # Declared identically to prod.docker-compose.yml so the two files merge onto
  # one network rather than Compose creating a second. Both must run under the
  # same project name for that to hold.
  fish-studio-net:
    driver: bridge
