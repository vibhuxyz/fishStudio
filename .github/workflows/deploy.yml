name: Smart Build and Deploy FishStudio

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # 1. API GATEWAY
  # ==========================================
  api-gateway:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[api-gateway]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api-gateway/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:prod
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,scope=api-gateway,mode=max

  # ==========================================
  # 2. AUTH SERVICE
  # ==========================================
  auth-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[auth-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/auth-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:prod
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,scope=auth-service,mode=max

  # ==========================================
  # 3. PRODUCT SERVICE
  # ==========================================
  product-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[product-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Product Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/product-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-service:prod
          cache-from: type=gha,scope=product-service
          cache-to: type=gha,scope=product-service,mode=max

  # ==========================================
  # 4. ORDER SERVICE
  # ==========================================
  order-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[order-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Order Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/order-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/order-service:prod
          cache-from: type=gha,scope=order-service
          cache-to: type=gha,scope=order-service,mode=max

  # ==========================================
  # 5. NOTIFICATION SERVICE
  # ==========================================
  notification-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[notification-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/notification-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notification-service:prod
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,scope=notification-service,mode=max

  # ==========================================
  # 6. WORKER SERVICE
  # ==========================================
  worker-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[worker-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Worker Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/worker-service:prod
          cache-from: type=gha,scope=worker-service
          cache-to: type=gha,scope=worker-service,mode=max

  # ==========================================
  # 7. PAYMENT SERVICE
  # ==========================================
  payment-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[payment-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Payment Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/payment-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/payment-service:prod
          cache-from: type=gha,scope=payment-service
          cache-to: type=gha,scope=payment-service,mode=max

  # ==========================================
  # 8. CONTROL CENTER

  # ==========================================
  # 9. DEPLOY TO AWS EC2
  # ==========================================
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs:
      [
        api-gateway,
        auth-service,
        product-service,
        order-service,
        notification-service,
        worker-service,
        payment-service,
        control-center,
      ]
    # Ensure deployment ONLY runs if at least one build ran and succeeded.
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/fish-studio
            docker compose pull
            docker compose up -d
            docker image prune -f
