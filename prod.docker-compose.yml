services:
  api-gateway:
    container_name: api-gateway
    image: 10xdevian134/api-gateway:prod
    restart: always
    ports:
      # Bound to 127.0.0.1 so ONLY Nginx can talk to it from the outside
      - "127.0.0.1:8080:8080"
    env_file: .env.prod
    environment:
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - auth-service
      - product-service
      - order-service
      - notification-service
      - payment-service
    networks:
      - fish-studio-net

  auth-service:
    container_name: auth-service
    image: 10xdevian134/auth-service:prod
    restart: always
    env_file: .env.prod
    environment:
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - rabbitmq-service
    networks:
      - fish-studio-net

  product-service:
    container_name: product-service
    image: 10xdevian134/product-service:prod
    restart: always
    env_file: .env.prod
    environment:
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - meilisearch
    networks:
      - fish-studio-net

  order-service:
    container_name: order-service
    image: 10xdevian134/order-service:prod
    restart: always
    env_file: .env.prod
    environment:
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - rabbitmq-service
    networks:
      - fish-studio-net

  notification-service:
    container_name: notification-service
    image: 10xdevian134/notification-service:prod
    restart: always
    env_file: .env.prod
    environment:
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - rabbitmq-service
    networks:
      - fish-studio-net

  worker-service:
    container_name: worker-service
    image: 10xdevian134/worker-service:prod
    restart: always
    env_file: .env.prod
    environment:
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - rabbitmq-service
    networks:
      - fish-studio-net

  payment-service:
    container_name: payment-service
    image: 10xdevian134/payment-service:prod
    restart: always
    env_file: .env.prod
    environment:
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    networks:
      - fish-studio-net

  control-center:
    container_name: control-center
    image: 10xdevian134/control-center:prod
    restart: always
    ports:
      # Bound to 127.0.0.1 like the gateway: Nginx terminates TLS and proxies
      # to it. Nothing here is a public listener.
      - "127.0.0.1:3003:3003"
    env_file: .env.prod
    environment:
      # Prometheus lives on this network, reached by its compose alias. The
      # dashboard queries it server-side, so Prometheus itself stays private.
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      # Flips the header badge from "Local stack · synthetic load" to
      # "Production traffic". The numbers are measured either way; this says
      # which they are.
      CONTROL_CENTER_ENVIRONMENT: production
    networks:
      - fish-studio-net

  rabbitmq-service:
    container_name: rabbitmq-service_prod
    # RabbitMQ stores its data under a node name derived from the hostname.
    # container_name makes Compose fall back to a random hostname, so without
    # this the node identity changes on every recreate.
    hostname: rabbitmq-service
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=mysecretpassword
    ports:
      # Bound to localhost for security!
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:5672:5672"
    networks:
      - fish-studio-net

  meilisearch:
    container_name: meilisearch_prod
    image: getmeili/meilisearch:v1.40.0
    restart: always
    environment:
      - MEILI_MASTER_KEY=masterKey123
    ports:
      # Bound to localhost for security!
      - "127.0.0.1:7700:7700"
    volumes:
      - ./meili_data:/meili_data
    networks:
      - fish-studio-net

networks:
  fish-studio-net:
    driver: bridge
